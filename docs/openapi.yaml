components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: hushd_access
      description: HttpOnly session cookie set by the auth endpoints.
  parameters:
    verificationId:
      name: verificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    payoutId:
      name: payoutId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 72 }
        role: { type: string, enum: [FAN, CREATOR] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        totpCode: { type: string, pattern: '^\d{6}$', description: Required when TOTP is enabled }
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional in the body — browser clients send it via the hushd_refresh cookie.
    EmailAddressRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 12, maxLength: 72 }
    TotpEnableRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^\d{6}$' }
    StartVerificationRequest:
      type: object
      required: [returnUrl]
      properties:
        returnUrl: { type: string, format: uri }
        locale: { type: string }
    Submit2257Request:
      type: object
      required: [legalFullName, dateOfBirth, documentType, documentNumber]
      properties:
        legalFullName: { type: string, minLength: 2, maxLength: 200 }
        dateOfBirth: { type: string, format: date, description: Must place the creator at 18+ }
        documentType: { type: string, example: PASSPORT }
        documentNumber: { type: string, minLength: 3, maxLength: 120 }
        issuedBy: { type: string }
    CreateSubscriptionCheckoutRequest:
      type: object
      required: [creatorSlug, tierId, successReturnUrl, cancelReturnUrl]
      properties:
        creatorSlug: { type: string }
        tierId: { type: string }
        successReturnUrl: { type: string, format: uri }
        cancelReturnUrl: { type: string, format: uri }
    CancelSubscriptionRequest:
      type: object
      required: [subscriptionId]
      properties:
        subscriptionId: { type: string, format: uuid }
        reason: { type: string }
    UpdateCreatorProfileRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: string, maxLength: 2000 }
        countryCode: { type: string, pattern: "^[A-Za-z]{2}$" }
    CreateTierRequest:
      type: object
      required: [title, priceCents]
      properties:
        title: { type: string }
        description: { type: string }
        priceCents: { type: integer, minimum: 100, maximum: 1000000 }
        interval: { type: string, enum: [MONTH, YEAR] }
        trialDays: { type: integer, minimum: 0, maximum: 30 }
    UpdateTierRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priceCents: { type: integer, minimum: 100, maximum: 1000000 }
        trialDays: { type: integer, minimum: 0, maximum: 30 }
        active: { type: boolean }
    CreatePostRequest:
      type: object
      required: [visibility]
      properties:
        body: { type: string }
        visibility: { type: string, enum: [PUBLIC, SUBSCRIBERS, TIER_LOCKED] }
        lockedTierId: { type: string, format: uuid }
        mediaIds:
          type: array
          items: { type: string, format: uuid }
    InitUploadRequest:
      type: object
      required: [ownerCreatorId, mediaType, contentType, byteSize]
      properties:
        ownerCreatorId: { type: string, format: uuid }
        mediaType: { type: string, enum: [IMAGE, VIDEO, AUDIO, OTHER] }
        contentType: { type: string, pattern: "^(image|video|audio)/" }
        byteSize: { type: integer, minimum: 1, maximum: 524288000 }
    CompleteUploadRequest:
      type: object
      required: [mediaId, ownerCreatorId, stagingKey, mediaType]
      properties:
        mediaId: { type: string, format: uuid }
        ownerCreatorId: { type: string, format: uuid }
        stagingKey: { type: string }
        mediaType: { type: string, enum: [IMAGE, VIDEO, AUDIO, OTHER] }
        contentType: { type: string }
        sha256: { type: string }
    SendMessageRequest:
      type: object
      required: [creatorId]
      properties:
        creatorId: { type: string, format: uuid }
        fanUserId: { type: string, format: uuid, description: Required when the sender is the creator }
        body: { type: string }
        ppvPriceCents: { type: integer, minimum: 100, description: Creators only }
        currency: { type: string }
    TipRequest:
      type: object
      required: [creatorId, amountCents]
      properties:
        creatorId: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        amountCents: { type: integer, minimum: 100 }
        currency: { type: string }
    CreatePayoutAccountRequest:
      type: object
      required: [method, accountReference]
      properties:
        method: { type: string, enum: [SEPA, ACH, WIRE, OTHER] }
        label: { type: string, maxLength: 80 }
        accountReference: { type: string, minLength: 4, maxLength: 200, description: Sealed at rest; only last four are exposed }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    RequestPayoutRequest:
      type: object
      properties:
        payoutAccountId: { type: string, format: uuid, description: Defaults to the most recent active account }
        amountCents: { type: integer, minimum: 1, description: Defaults to the full available balance }
    CreateReportRequest:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { type: string, enum: [POST, MESSAGE, USER, MEDIA] }
        targetId: { type: string }
        reason: { type: string }
    CreateDmcaRequest:
      type: object
      required: [claimantRef, targetRefs]
      properties:
        claimantRef: { type: string, minLength: 3, maxLength: 200 }
        targetRefs:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string }
        notesRef: { type: string, maxLength: 500 }
    CreateGeoBlockRequest:
      type: object
      required: [countryCode, scope]
      properties:
        countryCode: { type: string, pattern: "^[A-Za-z]{2}$" }
        scope: { type: string, enum: [ACCESS, PAYOUTS] }
        reason: { type: string, maxLength: 500 }
    UpdateDmcaStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [RECEIVED, UNDER_REVIEW, ACTIONED, REJECTED, CLOSED] }
        legalHold: { type: boolean }
    PendingVerificationResponse:
      type: object
      required: [pendingVerification, user]
      properties:
        pendingVerification: { type: boolean, enum: [true] }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
    MeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [FAN, CREATOR, ADMIN, MODERATOR] }
        status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, DELETED] }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        creatorSlug: { type: string, nullable: true }
        totpEnabled: { type: boolean }
    AuthTokensResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            roles:
              type: array
              items: { type: string }
